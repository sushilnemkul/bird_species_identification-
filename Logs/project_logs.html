<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Identification System - Project Log Sheets</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --primary-bg: #ffffff;
            --border-color: #000000;
            --text-main: #1a1a1a;
            --text-muted: #4b5563;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
        }

        body {
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            color: var(--text-main);
        }

        .page-container {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 20mm auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            page-break-after: always;
        }

        @media print {
            body { background: none; }
            .page-container {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logos-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-img {
            height: 80px;
            width: auto;
        }

        h1 { margin: 5px 0; font-size: 22pt; font-weight: bold; }
        h2 { margin: 5px 0; font-size: 16pt; font-weight: normal; }
        h3 { margin: 5px 0; font-size: 14pt; }

        .info-section {
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 12pt;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid var(--border-color);
            margin-bottom: 40px;
        }

        .log-table th, .log-table td {
            border: 1px solid var(--border-color);
            padding: 12px;
            vertical-align: top;
            text-align: left;
        }

        .table-header {
            background-color: #f9fafb;
            text-align: center !important;
            font-weight: bold;
            font-size: 13pt;
        }

        .field-label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .field-content {
            display: block;
            min-height: 40px;
            white-space: pre-line;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
        }

        .flex-row > div {
            width: 33%;
        }

        .footer-signature {
            position: absolute;
            bottom: 40mm;
            left: 20mm;
            right: 20mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .signature-line {
            width: 250px;
            border-top: 1px solid black;
            margin-top: 50px;
            padding-top: 10px;
            font-weight: bold;
        }

        .sub-text {
            font-size: 10pt;
            color: var(--text-muted);
        }

        .achievements-list, .problems-list {
            margin: 0;
            padding-left: 20px;
        }

        .achievements-list li, .problems-list li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

</body>
</html>
